name: Repository Status Sync

# Keeps the README.md AUTO-STATUS block, the per-paper one-sentence ideas in
# data/papers.json, and PAPERS.md in sync with the repository's pull requests,
# Actions run history, and paper database.
#
# Safety notes:
#   * The job always checks out the default branch. It never checks out or
#     executes code from a pull request head, which is why pull_request_target
#     can safely be used here to obtain a write-capable token.
#   * Only the AUTO-STATUS block, the `idea` field of newly discovered papers,
#     and the generated PAPERS.md are rewritten; the curated README content and
#     the AUTO-LITERATURE block stay untouched.
#   * The generated commit carries [skip ci] and the push trigger ignores both
#     generated files, so an automated commit cannot retrigger this workflow.

on:
  schedule:
    # GitHub cron is UTC. The weekly literature bot has been running around
    # 09:50 UTC on Mondays, so this runs shortly afterwards.
    - cron: "45 10 * * 1"
  workflow_run:
    workflows: ["Weekly LLM Data Literature Bot"]
    types: [completed]
  pull_request_target:
    types: [opened, closed, reopened]
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - PAPERS.md
      - data/papers.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: repository-status-sync
  cancel-in-progress: false

jobs:
  refresh-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate status block from PRs and Actions history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/update_repo_status.py \
            --readme README.md \
            --database data/papers.json \
            --repo "${GITHUB_REPOSITORY}"

      - name: Fill in missing one-sentence ideas
        run: python scripts/extract_ideas.py --database data/papers.json

      - name: Rebuild the complete paper index
        run: |
          python scripts/render_paper_index.py \
            --database data/papers.json \
            --output PAPERS.md

      - name: Commit and push when generated docs changed
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if git diff --quiet -- README.md PAPERS.md data/papers.json; then
            echo "Generated docs unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "repo-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PAPERS.md data/papers.json
          git commit -m "chore: refresh automation status, ideas and paper index [skip ci]"
          git push origin "HEAD:${TARGET_BRANCH}"
