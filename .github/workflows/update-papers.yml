name: Weekly LLM Data Literature Bot

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many recent calendar days to scan"
        required: false
        default: "14"
        type: string
  schedule:
    - cron: "17 10 * * 1"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-llm-data-literature-bot
  cancel-in-progress: false

jobs:
  discover-and-propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover recent papers
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        run: |
          python scripts/paper_bot.py \
            --config config/paper_bot.yaml \
            --readme README.md \
            --database data/papers.json \
            --lookback-days "${LOOKBACK_DAYS}" \
            --dedup-scope readme+database \
            --pr-body /tmp/paper_bot_pr_body.md

      - name: Check tracked changes
        id: changes
        shell: bash
        run: |
          git add README.md data/papers.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create bot branch and commit
        if: steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          BRANCH="bot/literature-update-${GITHUB_RUN_ID}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git config user.name "llm-data-literature-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git commit -m "chore: update recent LLM data literature"
          git push origin "${BRANCH}"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "📚 Weekly LLM Data Literature Update" \
            --body-file /tmp/paper_bot_pr_body.md

      - name: No new papers
        if: steps.changes.outputs.changed != 'true'
        run: echo "No new relevant papers were found; no PR was created."
