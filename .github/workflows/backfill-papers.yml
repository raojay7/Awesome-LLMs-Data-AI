name: Historical LLM Data Literature Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive start date (YYYY-MM-DD)"
        required: true
        default: "2026-07-01"
        type: string
      end_date:
        description: "Inclusive end date (YYYY-MM-DD). Leave empty to use current UTC date."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: historical-llm-data-backfill
  cancel-in-progress: false

jobs:
  backfill-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve date range
        id: dates
        shell: bash
        env:
          START_DATE_INPUT: ${{ inputs.start_date }}
          END_DATE_INPUT: ${{ inputs.end_date }}
        run: |
          START_DATE="${START_DATE_INPUT}"
          END_DATE="${END_DATE_INPUT}"
          if [ -z "${END_DATE}" ]; then
            END_DATE="$(date -u +%F)"
          fi
          REPORT="updates/${START_DATE}_to_${END_DATE}.md"
          echo "start_date=${START_DATE}" >> "$GITHUB_OUTPUT"
          echo "end_date=${END_DATE}" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"

      - name: Generate standalone backfill report
        run: |
          python scripts/paper_bot.py \
            --config config/paper_bot.yaml \
            --readme README.md \
            --database data/papers.json \
            --start-date "${{ steps.dates.outputs.start_date }}" \
            --end-date "${{ steps.dates.outputs.end_date }}" \
            --report-only \
            --output-report "${{ steps.dates.outputs.report }}" \
            --dedup-scope readme \
            --pr-body /tmp/paper_bot_pr_body.md

      - name: Check report change
        id: changes
        shell: bash
        run: |
          git add "${{ steps.dates.outputs.report }}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create backfill branch and commit
        if: steps.changes.outputs.changed == 'true'
        id: commit
        shell: bash
        run: |
          BRANCH="bot/backfill-${{ steps.dates.outputs.start_date }}-${{ steps.dates.outputs.end_date }}-${GITHUB_RUN_ID}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git config user.name "llm-data-literature-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git commit -m "docs: add literature backfill ${{ steps.dates.outputs.start_date }} to ${{ steps.dates.outputs.end_date }}"
          git push origin "${BRANCH}"

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${BRANCH}" \
            --title "📚 Literature Backfill: ${{ steps.dates.outputs.start_date }} → ${{ steps.dates.outputs.end_date }}" \
            --body-file /tmp/paper_bot_pr_body.md
